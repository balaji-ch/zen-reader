<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZenReader</title>
  <link rel="stylesheet" href="css/highlight-vs.css">
  <link rel="stylesheet" href="css/reader.css">
  <link id="google-fonts-link" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
</head>
<body>
  <!-- Toolbar -->
  <div id="toolbar">
    <div class="toolbar-left">
      <img src="icons/icon48.png" alt="" class="toolbar-icon">
      <h1 class="toolbar-title">ZenReader</h1>
    </div>
    <div class="toolbar-center">
      <!-- Text font trigger -->
      <button class="font-trigger" id="text-font-trigger" title="Text font settings">
        <span class="font-trigger-label">Text:</span>
        <span class="font-trigger-value" id="text-font-name">Inter</span>
        <span class="font-trigger-arrow">&#9662;</span>
      </button>

      <!-- Code font trigger -->
      <button class="font-trigger" id="code-font-trigger" title="Code font settings">
        <span class="font-trigger-label">Code:</span>
        <span class="font-trigger-value" id="code-font-name">JetBrains Mono</span>
        <span class="font-trigger-arrow">&#9662;</span>
      </button>
    </div>
    <div class="toolbar-right">
      <button id="btn-tips" title="Show tips"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 1 7 7c0 2.4-1.2 4.5-3 5.7V17H8v-2.3C6.2 13.5 5 11.4 5 9a7 7 0 0 1 7-7z"/></svg> Tips</button>
      <button id="btn-cleanup" title="Remove common noise (platform junk text)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M5 6v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V6"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg> Clean up</button>
      <button id="btn-print" title="Print"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg> Print</button>
      <button id="btn-pdf" title="Save as PDF"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><polyline points="9 15 12 12 15 15"/></svg> PDF</button>
    </div>
  </div>

  <!-- Text font popover -->
  <div class="font-popover" id="text-popover">
    <div class="popover-row">
      <label>Family</label>
      <select id="font-select">
        <optgroup label="Sans-serif">
          <option value="Inter" selected>Inter</option>
          <option value="IBM Plex Sans">IBM Plex Sans</option>
          <option value="Source Sans 3">Source Sans 3</option>
          <option value="Nunito">Nunito</option>
          <option value="Lato">Lato</option>
        </optgroup>
        <optgroup label="Serif">
          <option value="Merriweather">Merriweather</option>
          <option value="Lora">Lora</option>
          <option value="Crimson Text">Crimson Text</option>
          <option value="Libre Baskerville">Libre Baskerville</option>
          <option value="PT Serif">PT Serif</option>
        </optgroup>
      </select>
    </div>
    <div class="popover-row">
      <label>Size</label>
      <input type="range" id="font-size-range" min="12" max="24" value="16" step="1">
      <span class="size-value" id="font-size-label">16px</span>
    </div>
    <div class="popover-row">
      <label>Weight</label>
      <div class="weight-group" id="text-weight-group">
        <button class="weight-option active" data-weight="400">Regular</button>
        <button class="weight-option" data-weight="500">Medium</button>
        <button class="weight-option" data-weight="700">Bold</button>
      </div>
    </div>
  </div>

  <!-- Code font popover -->
  <div class="font-popover" id="code-popover">
    <div class="popover-row">
      <label>Family</label>
      <select id="code-font-select">
        <option value="JetBrains Mono" selected>JetBrains Mono</option>
        <option value="Fira Code">Fira Code</option>
        <option value="Source Code Pro">Source Code Pro</option>
      </select>
    </div>
    <div class="popover-row">
      <label>Size</label>
      <input type="range" id="code-size-range" min="9" max="18" value="13" step="0.5">
      <span class="size-value" id="code-size-label">13px</span>
    </div>
    <div class="popover-row">
      <label>Weight</label>
      <div class="weight-group" id="code-weight-group">
        <button class="weight-option active" data-weight="400">Regular</button>
        <button class="weight-option" data-weight="500">Medium</button>
        <button class="weight-option" data-weight="700">Bold</button>
      </div>
    </div>
  </div>

  <!-- PDF options dialog -->
  <div id="pdf-dialog-overlay" class="dialog-overlay hidden">
    <div class="dialog">
      <h3>PDF Options</h3>
      <div class="dialog-row">
        <label>Margins</label>
        <div class="margin-presets" id="margin-presets">
          <button class="margin-preset-btn" data-preset="none">No Margin</button>
          <button class="margin-preset-btn active" data-preset="minimal">Minimal</button>
          <button class="margin-preset-btn" data-preset="custom">Custom</button>
        </div>
      </div>
      <div class="dialog-row margin-custom-row hidden" id="margin-custom-row">
        <div class="margin-inputs">
          <div class="margin-input-group">
            <span class="margin-label">Top</span>
            <input type="number" id="margin-top" value="15" min="0" max="50" step="1">
          </div>
          <div class="margin-input-group">
            <span class="margin-label">Right</span>
            <input type="number" id="margin-right" value="15" min="0" max="50" step="1">
          </div>
          <div class="margin-input-group">
            <span class="margin-label">Bottom</span>
            <input type="number" id="margin-bottom" value="15" min="0" max="50" step="1">
          </div>
          <div class="margin-input-group">
            <span class="margin-label">Left</span>
            <input type="number" id="margin-left" value="15" min="0" max="50" step="1">
          </div>
        </div>
      </div>
      <div class="dialog-row">
        <label>Page size</label>
        <select id="pdf-page-size">
          <option value="a4" selected>A4</option>
          <option value="letter">Letter</option>
          <option value="legal">Legal</option>
        </select>
      </div>
      <div class="dialog-actions">
        <button id="pdf-cancel" class="dialog-btn-secondary">Cancel</button>
        <button id="pdf-generate" class="dialog-btn-primary">Generate PDF</button>
      </div>
    </div>
  </div>

  <!-- Article content -->
  <div id="reader-content">
    <article id="article">
      <header id="article-header">
        <h1 id="article-title"></h1>
        <p id="article-byline"></p>
        <p id="article-source"></p>
      </header>
      <div id="article-body"></div>
    </article>
  </div>

  <!-- Scripts -->
  <script src="lib/highlight.min.js"></script>
  <script src="reader.js"></script>
</body>
</html>
