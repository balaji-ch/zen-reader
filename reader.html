<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Generic fix for image CDNs with referrer/hotlink protection: many CDNs
       404 requests that carry a cross-origin (or chrome-extension://) Referer,
       but serve the image for "no-referrer" (direct) requests. This makes
       remote images load in the reader regardless of the source site. -->
  <meta name="referrer" content="no-referrer">
  <title>ZenReader</title>
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="lib/katex/katex.min.css">
  <link rel="stylesheet" href="css/highlight-vs.css">
  <link rel="stylesheet" href="css/reader.css">
  <link id="google-fonts-link" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" media="print" onload="this.media='all'">
</head>
<body>
  <!-- Reading Progress Bar -->
  <div id="progress-bar" class="progress-bar"></div>

  <!-- Top Banner -->
  <div id="banner">
    <div class="banner-row">
      <img src="icons/icon48.png" alt="" class="banner-icon">
      <h1 class="banner-title">ZenReader</h1>
    </div>
    <p class="banner-tagline">Zero distraction reading. Clutter free PDFs.</p>
  </div>

  <!-- Bookmarks Panel (left side, open by default) -->
  <div id="bookmarks-panel" class="bookmarks-panel">
    <div class="bookmarks-header">
      <span class="bookmarks-title"><img src="icons/icon16.png" alt="" class="bookmarks-logo"> Bookmarks</span>
      <button class="bookmarks-close" aria-label="Close bookmarks">&times;</button>
    </div>
    <div class="bookmarks-stats" id="bookmarks-stats"></div>
    <nav id="bookmarks-list" class="bookmarks-list"></nav>
    <div class="bookmarks-footer">
      <button id="btn-back-to-top" class="bookmarks-backtotop" title="Back to top">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
        Back to top
      </button>
    </div>
  </div>

  <!-- Floating Right Toolbar -->
  <!-- Buttons are grouped View / Edit / Export with .rtb-divider separators.
       No script indexes these children positionally, so the dividers are safe. -->
  <div id="right-toolbar" class="right-toolbar">
    <!-- Handle row: grip (drag to move, position remembered) + minimize button
         that collapses the toolbar into the gear button. -->
    <div class="rtb-handle-row">
      <div id="rtb-handle" class="rtb-handle" title="Drag to move">
        <svg width="18" height="10" viewBox="0 0 18 10" fill="currentColor" aria-hidden="true"><circle cx="4" cy="3" r="1.2"/><circle cx="9" cy="3" r="1.2"/><circle cx="14" cy="3" r="1.2"/><circle cx="4" cy="7" r="1.2"/><circle cx="9" cy="7" r="1.2"/><circle cx="14" cy="7" r="1.2"/></svg>
      </div>
      <button id="rtb-minimize" class="rtb-minimize" title="Minimize to gear" aria-label="Minimize toolbar">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
    </div>

    <!-- View group -->
    <button id="btn-bookmarks" class="rtb-btn active" title="Bookmarks (Alt+B)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
    </button>
    <button id="btn-appearance" class="rtb-btn" title="Fonts (Alt+F)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M2 20l5-15h1.5l5 15"/><path d="M4 14h6.5"/><path d="M16 20l3-10h1l3 10"/><path d="M17 16.5h4"/></svg>
    </button>
    <button id="btn-darkmode" class="rtb-btn" title="Dark mode (Alt+D)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
    <button id="btn-tips" class="rtb-btn" title="Tips (Alt+T)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 1 7 7c0 2.4-1.2 4.5-3 5.7V17H8v-2.3C6.2 13.5 5 11.4 5 9a7 7 0 0 1 7-7z"/></svg>
    </button>

    <div class="rtb-divider" aria-hidden="true"></div>

    <!-- Edit group -->
    <button id="btn-editmode" class="rtb-btn" title="Edit mode (Alt+E)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
    </button>
    <button id="btn-focus" class="rtb-btn" title="Focus mode (Alt+O)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
    </button>

    <div class="rtb-divider" aria-hidden="true"></div>

    <!-- Export group -->
    <button id="btn-print" class="rtb-btn" title="Print (Alt+P)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
    </button>
    <button id="btn-pdf" class="rtb-btn" title="Save as PDF (Alt+S)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><polyline points="9 15 12 12 15 15"/></svg>
    </button>
    <button id="btn-markdown" class="rtb-btn" title="Export as Markdown (Alt+M)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M2 18V6l5 7 5-7v12"/><path d="M18 6v9"/><polyline points="14.5 11.5 18 15 21.5 11.5"/></svg>
    </button>
  </div>

  <!-- Gear button (collapsed state of right toolbar) -->
  <button id="gear-btn" class="gear-btn hidden" title="Show toolbar">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
  </button>

  <!-- Appearance popover (replaces separate text/code popovers) -->
  <div class="appearance-popover hidden" id="appearance-popover">
    <div class="appearance-section">
      <h4>Layout Density</h4>
      <div class="popover-row">
        <div class="weight-group" id="density-group">
          <button class="weight-option" data-density="compact">Compact</button>
          <button class="weight-option active" data-density="comfortable">Comfortable</button>
          <button class="weight-option" data-density="spacious">Spacious</button>
        </div>
      </div>
    </div>
    <div class="appearance-section">
      <h4>Text Font</h4>
      <div class="popover-row">
        <label>Family</label>
        <select id="font-select">
          <optgroup label="Sans-serif">
            <option value="Inter" selected>Inter</option>
            <option value="IBM Plex Sans">IBM Plex Sans</option>
            <option value="Source Sans 3">Source Sans 3</option>
            <option value="Nunito">Nunito</option>
            <option value="Lato">Lato</option>
          </optgroup>
          <optgroup label="Serif">
            <option value="Merriweather">Merriweather</option>
            <option value="Lora">Lora</option>
            <option value="Crimson Text">Crimson Text</option>
            <option value="Libre Baskerville">Libre Baskerville</option>
            <option value="PT Serif">PT Serif</option>
          </optgroup>
        </select>
      </div>
      <div class="popover-row">
        <label>Size</label>
        <input type="range" id="font-size-range" min="12" max="24" value="16" step="1">
        <span class="size-value" id="font-size-label">16px</span>
      </div>
      <div class="popover-row">
        <label>Weight</label>
        <div class="weight-group" id="text-weight-group">
          <button class="weight-option active" data-weight="400">Regular</button>
          <button class="weight-option" data-weight="500">Medium</button>
          <button class="weight-option" data-weight="700">Bold</button>
        </div>
      </div>
    </div>
    <div class="appearance-section">
      <h4>Code Font</h4>
      <div class="popover-row">
        <label>Family</label>
        <select id="code-font-select">
          <option value="JetBrains Mono" selected>JetBrains Mono</option>
          <option value="Fira Code">Fira Code</option>
          <option value="Source Code Pro">Source Code Pro</option>
        </select>
      </div>
      <div class="popover-row">
        <label>Size</label>
        <input type="range" id="code-size-range" min="9" max="18" value="13" step="0.5">
        <span class="size-value" id="code-size-label">13px</span>
      </div>
      <div class="popover-row">
        <label>Weight</label>
        <div class="weight-group" id="code-weight-group">
          <button class="weight-option active" data-weight="400">Regular</button>
          <button class="weight-option" data-weight="500">Medium</button>
          <button class="weight-option" data-weight="700">Bold</button>
        </div>
      </div>
    </div>
    <div class="appearance-section">
      <h4>Custom CSS</h4>
      <textarea id="custom-css-input" class="custom-css-textarea" placeholder="/* Your custom styles */&#10;#article-body { line-height: 2; }"></textarea>
    </div>
  </div>

  <!-- PDF options dialog -->
  <div id="pdf-dialog-overlay" class="dialog-overlay hidden">
    <div class="dialog">
      <h3>PDF Options</h3>
      <div class="dialog-row">
        <label>Margins</label>
        <div class="margin-presets" id="margin-presets">
          <button class="margin-preset-btn" data-preset="none">No Margin</button>
          <button class="margin-preset-btn active" data-preset="minimal">Minimal</button>
          <button class="margin-preset-btn" data-preset="custom">Custom</button>
        </div>
      </div>
      <div class="dialog-row margin-custom-row hidden" id="margin-custom-row">
        <div class="margin-inputs">
          <div class="margin-input-group">
            <span class="margin-label">Top</span>
            <input type="number" id="margin-top" value="15" min="0" max="50" step="1">
          </div>
          <div class="margin-input-group">
            <span class="margin-label">Right</span>
            <input type="number" id="margin-right" value="15" min="0" max="50" step="1">
          </div>
          <div class="margin-input-group">
            <span class="margin-label">Bottom</span>
            <input type="number" id="margin-bottom" value="15" min="0" max="50" step="1">
          </div>
          <div class="margin-input-group">
            <span class="margin-label">Left</span>
            <input type="number" id="margin-left" value="15" min="0" max="50" step="1">
          </div>
        </div>
      </div>
      <div class="dialog-row">
        <label>Page size</label>
        <select id="pdf-page-size">
          <option value="a4" selected>A4</option>
          <option value="letter">Letter</option>
          <option value="legal">Legal</option>
        </select>
      </div>
      <div class="dialog-row">
        <label class="checkbox-label">
          <input type="checkbox" id="pdf-toc"> Include Table of Contents
        </label>
      </div>
      <div class="dialog-actions">
        <button id="pdf-cancel" class="dialog-btn-secondary">Cancel</button>
        <button id="pdf-generate" class="dialog-btn-primary">Generate PDF</button>
      </div>
    </div>
  </div>

  <!-- Article content -->
  <div id="reader-content">
    <article id="article">
      <header id="article-header">
        <h1 id="article-title"></h1>
        <p id="article-byline"></p>
        <p id="article-source"></p>
      </header>
      <div id="article-body"></div>
    </article>
  </div>

  <!-- Scripts -->
  <script src="lib/highlight.min.js"></script>
  <script src="lib/katex/katex.min.js"></script>
  <script src="lib/katex/auto-render.min.js"></script>
  <script src="reader.js"></script>
</body>
</html>
